paths:
  run_root: runs
  voec_config: voec_sim/configs/voec_config.yaml

scenario:
  id: battaglia_cittadina_2_1
  seed: 42

model:
  device: auto
  device_benchmark_steps: 30
  observation_dim: 4
  encoder_type: cnn
  observation_channels: 32
  observation_height: 32
  observation_width: 32
  hidden_dim: 64
  dynamics_blocks: 2
  prediction_blocks: 2
  action_dim: 32
  learning_rate: 0.001

selfplay:
  num_workers: 8
  max_steps: 60
  max_steps_override: 0
  mcts_simulations: 32
  mcts_c_puct: 1.5
  mcts_unroll_steps: 3
  mcts_discount: 0.997
  mcts_temperature: 1.0
  mcts_dirichlet_alpha: 0.3
  mcts_dirichlet_epsilon: 0.0
  timeout_penalty: -0.35
  reward_shaping:
    terminal_scale: 1.0
    damage_weight: 0.02
    kill_weight: 0.25
    vp_action_bonus: 0.02
    capture_bonus: 0.05
    vp_capture_bonus_per_hex: 0.65
    vp_net_gain_bonus: 0.15
    vp_net_loss_penalty: 0.01
    objective_progress_bonus_per_hex: 0.18
    objective_no_progress_penalty: 0.08
    objective_no_progress_attack_penalty: 0.12
    reaction_fire_miss_penalty: 0.02
    idle_penalty: -0.05
    idle_with_options_multiplier: 2.5

train:
  iterations: 2
  episodes_per_iter: 2
  batch_size: 8
  objective_loss_weight: 0.0
  objective_target_mode: progress
  objective_pos_weight: 4.0
  replay_capacity: 20000
  resume_checkpoint: ""
