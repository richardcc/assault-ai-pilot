paths:
  run_root: runs
  voec_config: voec_sim/configs/voec_config.yaml

scenario:
  id: battaglia_cittadina_2_1
  seed: 42

model:
  device: auto
  device_benchmark_steps: 40
  observation_dim: 4
  encoder_type: cnn
  observation_channels: 32
  observation_height: 16
  observation_width: 16
  hidden_dim: 48
  dynamics_blocks: 3
  prediction_blocks: 2
  action_dim: 32
  learning_rate: 0.0005

selfplay:
  device: cpu
  num_workers: 6
  parallel_backend: process
  matchup_modes: [self_vs_self, self_vs_random]
  matchup_mode_weights:
    self_vs_self: 1
    self_vs_random: 0
  max_steps: 100
  max_steps_override: 0
  max_turns_override: 0
  mcts_simulations: 256
  mcts_c_puct: 2.3
  mcts_unroll_steps: 4
  mcts_discount: 0.997
  mcts_temperature: 1.1
  mcts_dirichlet_alpha: 0.3
  mcts_dirichlet_epsilon: 0.35
  mcts_q_clip_abs: 1000000.0
  mcts_min_root_visits_per_action: 5
  mcts_min_root_visits_top_n: 0
  mcts_q_root_normalization_mode: adaptive_minmax
  mcts_q_root_normalization_strength: 0.90
  mcts_value_rescale_mode: tanh
  mcts_value_rescale_temperature: 1.5
  mcts_vp_tiebreak_epsilon: 0.05
  mcts_q_flat_spread_epsilon: 1.0e-6
  mcts_vp_flat_q_score_epsilon: 0.02
  mcts_vp_flat_q_min_progress: 0.0
  mcts_chance_mode: off
  mcts_chance_samples_per_expansion: 1
  mcts_chance_value_noise_std: 0.0
  mcts_success_prob_enabled: true
  mcts_success_prob_alpha: 0.25
  mcts_success_prob_center: 0.45
  mcts_success_prob_scale: 0.35
  mcts_success_prob_centered_clip_abs: 1.0
  mcts_success_prob_expected_damage_scale: 3.0
  unit_prefilter_enabled: true
  unit_prefilter_replan_enabled: true
  unit_prefilter_top_k: 3
  unit_prefilter_vp_progress_weight: 1.0
  unit_prefilter_capture_opportunity_weight: 2.0
  unit_prefilter_threat_weight: 0.25
  timeout_penalty: -0.35
  enemy_can_capture_vp_next_default: 0
  enemy_min_steps_to_vp_default: 99.0
  enemy_threat_component_default: 0.0
  reward_shaping:
    terminal_scale: 1.0
    damage_weight: 0.10
    kill_weight: 0.55
    vp_action_bonus: 0.14
    capture_bonus: 0.70
    vp_capture_bonus_per_hex: 1.45
    vp_net_gain_bonus: 0.30
    vp_net_loss_penalty: 0.20
    objective_progress_bonus_per_hex: 1.05
    objective_no_progress_penalty: 0.28
    objective_no_progress_attack_penalty: 0.24
    reaction_fire_miss_penalty: 0.08
    reaction_fire_soft_signal_enabled: true
    reaction_fire_soft_signal_weight: 0.10
    reaction_fire_soft_signal_expected_damage_scale: 4.0
    reaction_exposure_component_enabled: true
    reaction_exposure_component_weight: 0.06
    reaction_exposure_component_cap_abs: 0.20
    global_strategy_soft_enabled: true
    global_strategy_vp_control_net_gain_weight: 0.16
    global_strategy_units_in_vp_ring_weight: 0.08
    global_strategy_enemy_vp_threat_reduced_weight: 0.10
    global_strategy_sustained_vp_advantage_weight: 0.05
    global_strategy_role_consistency_weight: 0.06
    global_strategy_setup_convert_weight: 0.06
    global_strategy_vp_ring_radius: 2
    global_strategy_enemy_threat_radius: 3
    global_strategy_sustained_advantage_min_turns: 2
    global_strategy_total_cap_abs: 0.20
    vp_horizon_soft_enabled: true
    vp_horizon_soft_weight: 0.03
    vp_horizon_soft_cap_steps: 8.0
    enemy_threat_component_enabled: false
    enemy_threat_component_weight: 0.01
    enemy_threat_component_horizon_steps: 6.0
    enemy_threat_component_cap_abs: 0.03
    enemy_threat_component_immediate_capture_bonus: 0.40
    mobility_opportunity_cost_component_enabled: false
    mobility_opportunity_cost_component_weight: 0.01
    mobility_opportunity_cost_component_cap_abs: 0.02
    cross_unit_synergy_component_enabled: false
    cross_unit_synergy_component_weight: 0.01
    cross_unit_synergy_component_cap_abs: 0.02
    obs_enemy_vp_threat_radius: 6
    obs_vp_ownership_ttl_cap: 8
    idle_penalty: -0.08
    idle_with_options_multiplier: 3.0
    terminal_win_bonus: 0.20
    terminal_draw_bonus: 0.02
    terminal_loss_penalty: 0.20

train:
  iterations: 60
  episodes_per_iter: 20
  train_updates_per_iter: 9
  checkpoint_every: 5
  batch_size: 24
  objective_loss_weight: 0.12
  consistency_loss_weight: 0.05
  consistency_unroll_steps: 3
  reanalysis_ratio: 0.35
  reanalysis_value_mix: 0.50
  reanalysis_policy_mix: 0.25
  value_bootstrap_steps: 5
  value_bootstrap_discount: 0.997
  amp_enabled: true
  amp_dtype: auto
  compile_model: false
  compile_mode: reduce-overhead
  matmul_precision: high
  objective_target_mode: progress
  objective_pos_weight: 6.8
  aux_objective_enabled: false
  aux_objective_loss_weight: 0.0
  aux_intent_loss_weight: 0.5
  aux_multi_vp_loss_weight: 0.5
  aux_multi_vp_feature_dim: 4
  aux_intent_classes: 8
  objective_opportunity_max_dist: 3
  objective_signal:
    opportunity_near_vp_max_dist: 3
  objective_head:
    progress_positive_threshold: 0.0
  objective_reporting:
    conversion_window_steps_after_progress: 2
    assault_advantage_prob_threshold: 0.55
    assault_advantage_margin_threshold: 0.20
    assault_advantage_legal_count_threshold: 6
    assault_advantage_min_score: 2
  replay_capacity: 30000
  replay_recent_fraction: 0.7
  replay_recent_window_ratio: 0.3
  enable_post_train_analytics: false
  resume_checkpoint: ""

