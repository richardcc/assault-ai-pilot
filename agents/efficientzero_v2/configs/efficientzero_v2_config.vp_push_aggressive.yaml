paths:
  run_root: runs
  voec_config: voec_sim/configs/voec_config.yaml

scenario:
  id: battaglia_cittadina_2_1
  seed: 42

model:
  device: auto
  device_benchmark_steps: 40
  observation_dim: 4
  encoder_type: cnn
  observation_channels: 38
  observation_height: 16
  observation_width: 16
  hidden_dim: 48
  dynamics_blocks: 3
  prediction_blocks: 2
  action_dim: 32
  learning_rate: 0.0005

selfplay:
  device: cpu
  num_workers: 1
  max_steps: 100
  max_steps_override: 0
  max_turns_override: 0
  mcts_simulations: 64
  mcts_c_puct: 1.5
  mcts_unroll_steps: 4
  mcts_discount: 0.997
  mcts_temperature: 0.62
  mcts_dirichlet_alpha: 0.3
  mcts_dirichlet_epsilon: 0.20
  mcts_q_clip_abs: 40.0
  mcts_q_root_normalization_mode: adaptive_minmax
  mcts_q_root_normalization_strength: 0.72
  mcts_vp_tiebreak_epsilon: 0.10
  mcts_q_flat_spread_epsilon: 2.0e-5
  mcts_vp_flat_q_score_epsilon: 0.10
  mcts_vp_flat_q_min_progress: 0.02
  mcts_chance_mode: off
  mcts_chance_samples_per_expansion: 1
  mcts_chance_value_noise_std: 0.0
  mcts_success_prob_enabled: false
  mcts_success_prob_alpha: 0.0
  mcts_success_prob_center: 0.5
  mcts_success_prob_scale: 0.5
  mcts_success_prob_centered_clip_abs: 1.0
  mcts_success_prob_expected_damage_scale: 4.0
  timeout_penalty: -0.40
  reward_shaping:
    terminal_scale: 1.0
    damage_weight: 0.05
    kill_weight: 0.40
    vp_action_bonus: 0.22
    capture_bonus: 1.25
    vp_capture_bonus_per_hex: 1.95
    vp_net_gain_bonus: 0.62
    vp_net_loss_penalty: 0.34
    objective_progress_bonus_per_hex: 1.85
    objective_team_progress_bonus_per_hex: 0.80
    objective_progress_cap_abs: 1.20
    objective_team_progress_cap_abs: 1.60
    objective_no_progress_penalty: 1.25
    objective_no_progress_attack_penalty: 1.20
    reaction_fire_miss_penalty: 0.08
    reaction_fire_soft_signal_enabled: true
    reaction_fire_soft_signal_weight: 0.05
    reaction_fire_soft_signal_expected_damage_scale: 4.0
    global_strategy_soft_enabled: true
    global_strategy_vp_control_net_gain_weight: 0.12
    global_strategy_units_in_vp_ring_weight: 0.07
    global_strategy_enemy_vp_threat_reduced_weight: 0.08
    global_strategy_sustained_vp_advantage_weight: 0.04
    global_strategy_role_consistency_weight: 0.02
    global_strategy_setup_convert_weight: 0.06
    global_strategy_vp_ring_radius: 2
    global_strategy_enemy_threat_radius: 3
    global_strategy_sustained_advantage_min_turns: 2
    global_strategy_total_cap_abs: 0.22
    idle_penalty: -0.14
    idle_with_options_multiplier: 3.2
    terminal_win_bonus: 0.20
    terminal_draw_bonus: 0.02
    terminal_loss_penalty: 0.20

train:
  iterations: 50
  episodes_per_iter: 20
  train_updates_per_iter: 9
  checkpoint_every: 5
  batch_size: 24
  objective_loss_weight: 0.16
  consistency_loss_weight: 0.05
  consistency_unroll_steps: 3
  reanalysis_ratio: 0.35
  reanalysis_value_mix: 0.50
  reanalysis_policy_mix: 0.25
  value_bootstrap_steps: 5
  value_bootstrap_discount: 0.997
  amp_enabled: true
  amp_dtype: auto
  compile_model: false
  compile_mode: reduce-overhead
  matmul_precision: high
  objective_target_mode: progress
  objective_pos_weight: 9.0
  aux_objective_enabled: false
  aux_objective_loss_weight: 0.0
  aux_intent_loss_weight: 0.5
  aux_multi_vp_loss_weight: 0.5
  aux_multi_vp_feature_dim: 4
  aux_intent_classes: 8
  objective_opportunity_max_dist: 3
  objective_signal:
    opportunity_near_vp_max_dist: 3
  objective_head:
    progress_positive_threshold: 0.0
  objective_reporting:
    conversion_window_steps_after_progress: 2
    assault_advantage_prob_threshold: 0.55
    assault_advantage_margin_threshold: 0.20
    assault_advantage_legal_count_threshold: 6
    assault_advantage_min_score: 2
  replay_capacity: 30000
  replay_recent_fraction: 0.7
  replay_recent_window_ratio: 0.3
  enable_post_train_analytics: false
  resume_checkpoint: ""
