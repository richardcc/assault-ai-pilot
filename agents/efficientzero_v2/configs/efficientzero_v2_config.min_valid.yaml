paths:
  run_root: runs
  voec_config: voec_sim/configs/voec_config.yaml

scenario:
  id: battaglia_cittadina_2_1
  seed: 42

model:
  device: cuda
  device_benchmark_steps: 40
  observation_dim: 4
  encoder_type: cnn
  observation_channels: 32
  observation_height: 16
  observation_width: 16
  hidden_dim: 64
  dynamics_blocks: 1
  prediction_blocks: 1
  action_dim: 32
  learning_rate: 0.0005

selfplay:
  device: cpu
  # Keep 1 worker on Windows for stability.
  num_workers: 1
  collect_xai: false
  max_steps: 80
  max_steps_override: 0
  mcts_simulations: 4
  mcts_c_puct: 1.5
  mcts_unroll_steps: 4
  mcts_discount: 0.997
  mcts_temperature: 0.40
  mcts_dirichlet_alpha: 0.3
  mcts_dirichlet_epsilon: 0.08
  timeout_penalty: -0.35
  reward_shaping:
    terminal_scale: 1.0
    damage_weight: 0.04
    kill_weight: 0.35
    vp_action_bonus: 0.14
    capture_bonus: 0.62
    vp_capture_bonus_per_hex: 1.12
    vp_net_gain_bonus: 0.30
    vp_net_loss_penalty: 0.20
    objective_progress_bonus_per_hex: 0.56
    objective_no_progress_penalty: 0.30
    objective_no_progress_attack_penalty: 0.35
    reaction_fire_miss_penalty: 0.08
    idle_penalty: -0.08
    idle_with_options_multiplier: 3.0
    terminal_win_bonus: 0.20
    terminal_draw_bonus: 0.02
    terminal_loss_penalty: 0.20

train:
  # 120 episodes total -> first statistically useful pass.
  iterations: 30
  episodes_per_iter: 4
  train_updates_per_iter: 3
  checkpoint_every: 5
  batch_size: 32
  objective_loss_weight: 0.24
  consistency_loss_weight: 0.05
  consistency_unroll_steps: 2
  reanalysis_ratio: 0.20
  reanalysis_value_mix: 0.40
  reanalysis_policy_mix: 0.20
  value_bootstrap_steps: 3
  value_bootstrap_discount: 0.997
  amp_enabled: true
  amp_dtype: auto
  compile_model: true
  compile_mode: reduce-overhead
  matmul_precision: high
  objective_target_mode: progress
  objective_pos_weight: 5.6
  objective_opportunity_max_dist: 2.5
  replay_capacity: 20000
  replay_recent_fraction: 0.7
  replay_recent_window_ratio: 0.3
  enable_post_train_analytics: false
  short_episode_threshold: 80
  resume_checkpoint: ""

