name: self_vs_self_vs_random_2scenarios_v1
engine: efficientzero_v2
description: >
  Two-scenario progressive curriculum (battaglia + mettere) with VP-first gates,
  38-channel sensory input (turn urgency + paralysis exposure risk), PCGrad gradient balancing,
  and anti-paralysis offensive quality gates for vs_random_side_b (US Attacker).

phases:
  - name: phase1_bootstrap
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase1_bootstrap.yaml
    eval_config: assault_bench/configs/benchmark_config.curriculum_2scenarios_phase1_256_80_20.yaml
    gate:
      min_vp_capture_take_rate: 0.080
      min_tracked_captured_avg: 2.50
      min_vp_net_avg_tracked_side: 0.35
      min_recon_survival_rate: 0.40
      min_fire_support_stationarity: 0.45
      min_doctrine_adherence_rate: 0.35
      profile_soft_guardrail:
        ezv2_vs_random_side_b:
          severe_min_score: 0.20

  - name: phase1_channel_adapt
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase1_channel_adapt.yaml
    eval_config: assault_bench/configs/benchmark_config.curriculum_2scenarios_phase1_256_70_30.yaml
    gate:
      no_regression_defeat_rate: true
      min_vp_capture_take_rate: 0.090
      min_tracked_captured_avg: 2.55
      min_vp_net_avg_tracked_side: 0.38
      profile_soft_guardrail:
        ezv2_vs_random_side_b:
          severe_min_score: 0.30
          max_score_drop_vs_prev: 0.20

  - name: phase1_refine_aggressive
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase1_refine_aggressive.yaml
    eval_config: assault_bench/configs/benchmark_config.curriculum_2scenarios_phase1_256_60_40.yaml
    gate:
      no_regression_defeat_rate: true
      min_vp_capture_take_rate_delta: 0.005
      min_vp_capture_take_rate: 0.100
      min_tracked_captured_avg: 2.60
      min_vp_net_avg_tracked_side: 0.40
      profile_soft_guardrail:
        ezv2_vs_random_side_b:
          severe_min_score: 0.40
          max_score_drop_vs_prev: 0.20

  - name: phase2_mix_70_30
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase2_mix_70_30.yaml
