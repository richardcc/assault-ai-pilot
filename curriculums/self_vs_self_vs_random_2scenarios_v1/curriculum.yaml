name: self_vs_self_vs_random_2scenarios_v1
engine: efficientzero_v2
description: >
  Two-scenario progressive curriculum (battaglia + mettere) with VP-first gates,
  global aggregated promotion, and soft guardrail for difficult vs_random_side_b profile.

phases:
  - name: phase1_bootstrap
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase1_bootstrap.yaml
    eval_config: assault_bench/configs/benchmark_config.curriculum_2scenarios_phase1_256_80_20.yaml
    gate:
      min_vp_capture_take_rate: 0.055
      min_tracked_captured_avg: 2.35
      min_vp_net_avg_tracked_side: 0.30
      profile_soft_guardrail:
        muzero_vs_random_side_b:
          severe_min_score: 0.03

  - name: phase1_channel_adapt
    train_config: curriculums/self_vs_self_vs_random_2scenarios_v1/configs/efficientzero_v2.phase1_channel_adapt.yaml
    eval_config: assault_bench/configs/benchmark_config.curriculum_2scenarios_phase1_256_70_30.yaml
    gate:
      no_regression_defeat_rate: true
      min_vp_capture_take_rate: 0.060
      min_tracked_captured_avg: 2.40
      min_vp_net_avg_tracked_side: 0.34
      profile_soft_guardrail:
        muzero_vs_random_side_b:
          severe_min_score: 0.03
          max_score_drop_vs_prev: 0.20

