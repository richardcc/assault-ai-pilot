base_config: curriculums/self_vs_self_vs_random_recovery_v1/configs/efficientzero_v2.phase1_bootstrap.recovery.yaml

selfplay:
  matchup_modes: [self_vs_self, self_vs_random]
  matchup_mode_weights:
    self_vs_self: 9
    self_vs_random: 1
  mcts_simulations: 256
  mcts_vp_flat_q_score_epsilon: 0.035

train:
  iterations: 16
  episodes_per_iter: 16
  train_updates_per_iter: 10
  reanalysis_ratio: 0.34
  objective_loss_weight: 0.20
