base_config: agents/efficientzero_v2/configs/efficientzero_v2_config.yaml
scenario:
  id: vp_phase3_race_2v2
selfplay:
  num_workers: 24
  parallel_backend: process
  inference_max_batch_size: 64
  inference_batch_wait_ms: 1.5
  reward_shaping:
    time_scaled_pbrs: true
    breach_distance: 2
    breach_casualty_attenuation: 0.35
    vp_contested_bonus: 1.5
    vp_capture_bonus_per_hex: 15.0
    objective_progress_bonus_per_hex: 10.5
    capture_bonus: 6.0
    kill_weight: 0.35
    terminal_scale: 1.5
    terminal_loss_penalty: 1.5
    opportunity_near_vp_max_dist: 10.0
    vp_potential_weight: 2.2
    vp_potential_gamma: 0.997
    vp_potential_ctrl_bonus: 4.5
    vp_urgency_lambda: 1.8
    paralysis_penalty_weight: 0.12
    idle_penalty: -0.25
  mcts_temperature: 1.10
train:
  iterations: 80
  episodes_per_iter: 32
  objective_loss_weight: 0.61
  train_updates_per_iter: 27
  reanalysis_ratio: 0.5
