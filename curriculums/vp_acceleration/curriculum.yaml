name: vp_acceleration_v1
engine: efficientzero_v2
description: >
  Currículum Progresivo Acelerado de Captura de VPs (Paridad Humana).
  5 Fases progresivas:
  1) VPs desocupados a 3 hexágonos (Sprint puro de captura);
  2) VPs defendidos por unidad estática suprimida (Base of Fire + Asalto combinado);
  3) Carrera frontal simultánea de VPs 2 vs 2 unidades (Postura ASSAULT_VP y Urgencia);
  4) Escenario táctico completo (Gela - Battaglia Cittadina: Victoria >= 75% vs bot heurístico en <15 turnos);
  5) Asalto Urbano Puro Ofensivo Asimétrico (US 100% atacante vs Random en Battaglia Cittadina, T=8, timeout penalty -1.0).

phases:
  - name: phase1_vp_sprint_unoccupied
    train_config: curriculums/vp_acceleration/configs/efficientzero_v2.phase1_unoccupied.yaml
    eval_config: assault_bench/configs/benchmark_config.vp_acceleration_phase1.yaml
    gate:
      min_vp_capture_take_rate: 0.12
      min_tracked_captured_avg: 0.90
      min_vp_net_avg_tracked_side: 0.50
      min_win_rate: 0.80

  - name: phase2_vp_assault_suppressed
    max_reinforcement_cycles: 5
    train_config: curriculums/vp_acceleration/configs/efficientzero_v2.phase2_defended.yaml
    eval_config: assault_bench/configs/benchmark_config.vp_acceleration_phase2.yaml
    gate:
      no_regression_defeat_rate: true
      min_vp_capture_take_rate: 0.10
      min_tracked_captured_avg: 0.90
      min_spearhead_vp_capture_rate: 0.60
      min_fire_support_stationarity: 0.50
      min_doctrine_adherence_rate: 0.45
      min_win_rate: 0.75

  - name: phase3_vp_race_2v2
    max_reinforcement_cycles: 5
    train_config: curriculums/vp_acceleration/configs/efficientzero_v2.phase3_race_2v2.yaml
    eval_config: assault_bench/configs/benchmark_config.vp_acceleration_phase3.yaml
    gate:
      no_regression_defeat_rate: true
      max_loss_rate: 0.25
      min_score: 0.45
      min_win_rate: 0.25
      min_vp_capture_take_rate: 0.035
      min_tracked_captured_avg: 0.85
      min_vp_net_avg_tracked_side: 0.00
      min_doctrine_adherence_rate: 0.40

  - name: phase4_tactical_gela_mastery
    max_reinforcement_cycles: 5
    train_config: curriculums/vp_acceleration/configs/efficientzero_v2.phase4_gela_mastery.yaml
    eval_config: assault_bench/configs/benchmark_config.vp_acceleration_phase4.yaml
    gate:
      no_regression_defeat_rate: true
      min_win_rate_vs_heuristic: 0.45
      min_score: 0.45
      max_avg_turns: 15.0
      min_vp_capture_take_rate: 0.040
      min_tracked_captured_avg: 2.00
      min_vp_net_avg_tracked_side: 0.20
      min_doctrine_adherence_rate: 0.40
      min_recon_survival_rate: 0.35
      min_fire_support_stationarity: 0.40

  - name: phase5_urban_assault_pure_offensive
    max_reinforcement_cycles: 10
    train_config: curriculums/vp_acceleration/configs/efficientzero_v2.phase5_urban_assault_pure_offensive.yaml
    eval_config: assault_bench/configs/benchmark_config.vp_acceleration_phase5.yaml
    gate:
      no_regression_defeat_rate: true
      min_win_rate: 0.45
      min_score: 0.50
      min_tracked_captured_avg: 2.20
      max_avg_turns: 10.0
      min_vp_capture_take_rate: 0.020
      min_doctrine_adherence_rate: 0.40
