base_config: curriculums/self_vs_self_vs_random_v1/configs/efficientzero_v2.phase1_bootstrap.yaml

selfplay:
  num_workers: 6
  parallel_backend: process
  mcts_simulations: 256
  mcts_vp_tiebreak_epsilon: 0.12
  mcts_vp_flat_q_score_epsilon: 0.05
  mcts_vp_flat_q_min_progress: 0.0
  unit_prefilter_enabled: true
  unit_prefilter_replan_enabled: true
  unit_prefilter_top_k: 4
  unit_prefilter_vp_progress_weight: 1.35
  unit_prefilter_capture_opportunity_weight: 3.6
  unit_prefilter_threat_weight: 0.20
  reward_shaping:
    capture_bonus: 1.05
    vp_capture_bonus_per_hex: 2.15
    objective_progress_bonus_per_hex: 1.65
    objective_no_progress_penalty: 0.42
    objective_no_progress_attack_penalty: 0.34
    vp_horizon_soft_weight: 0.060

train:
  iterations: 28
  episodes_per_iter: 14
  batch_size: 16
  train_updates_per_iter: 6
  reanalysis_ratio: 0.26
  consistency_loss_weight: 0.02
  objective_loss_weight: 0.18
  objective_signal:
    opportunity_near_vp_max_dist: 4
  objective_reporting:
    conversion_window_steps_after_progress: 3
