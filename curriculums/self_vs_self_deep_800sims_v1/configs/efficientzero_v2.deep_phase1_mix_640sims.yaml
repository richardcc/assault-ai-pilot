base_config: agents/efficientzero_v2/configs/efficientzero_v2_config.yaml

paths:
  run_root: runs_curriculum

scenario:
  id: battaglia_cittadina_2_1
  ids: [battaglia_cittadina_2_1, mettete_i_piedi_terra_1]
  weights: [50, 50]

selfplay:
  num_workers: 6
  parallel_backend: process
  matchup_modes: [self_vs_self, self_vs_random]
  matchup_mode_weights:
    self_vs_self: 7
    self_vs_random: 3
  mcts_simulations: 640
  reward_shaping:
    kill_weight: 0.65
    timeout_penalty: -0.50
    objective_no_progress_penalty: 0.35
    vp_capture_bonus_per_hex: 1.60

train:
  iterations: 60
  episodes_per_iter: 36
  train_updates_per_iter: 10
