site_name: Assault Wargame & AI Platform
site_description: Documentación Canónica y Plataforma de Inteligencia Artificial Militar EfficientZero V2
site_author: Assault AI Core Team
site_dir: site
docs_dir: docs
exclude_docs: |
  pdfs/**
  papers/**
  audit_*
  README.md
  16_INFORME_EJECUCION_CURRICULUM_Y_AUDITORIA_TACTICA.md

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - 0. Premisas del Proyecto y Gobernanza: 00_PREMISAS_DEL_PROYECTO.md
  - 1. Arquitectura del Sistema: 01_ARQUITECTURA_DEL_SISTEMA.md
  - 2. Modelo del Juego y Reglas Tácticas: 02_MODELO_DEL_JUEGO_Y_REGLAS_TACTICAS.md
  - 3. Red Neuronal EfficientZero V2: 03_RED_NEURONAL_EFFICIENTZERO_V2.md
  - 4. Plataforma MLOps y Telemetría: 04_PLATAFORMA_MLOPS_Y_TELEMETRIA.md
  - 5. Auditoría Literatura Científica: 06_LITERATURE_AUDIT_CHANNELS_HEADS_TACTICS.md
  - 6. Sistema RAG Copilot: 06_SISTEMA_RAG_COPILOT.md
  - 7. Servicios Backend y Catálogo de APIs: 07_SERVICIOS_BACKEND_Y_CATALOGO_APIS.md
  - 8. Auditoría Reglamento vs. Engine: 08_AUDITORIA_REGLAMENTO_VS_ENGINE.md
  - 9. Métricas y Perfilado:
      - Inventario Canónico de Métricas: 13_INVENTARIO_CANONICO_METRICAS.md
      - Plan Estratégico Perfilado de Unidades: 14_PLAN_PERFILADO_UNIDADES_IA.md
  - 10. Currículums y Entrenamiento:
      - Currículums y Entrenamiento Progresivo: 15_CURRICULUMS_Y_ENTRENAMIENTO_PROGRESSIVO.md
  - 11. Informes de Ejecución:
      - Cabecera y Catálogo de Informes: informes_ejecucion/00_CABECERA_INFORMES_EJECUCION.md
      - Informe 01 - Currículum y Auditoría Táctica Forense: informes_ejecucion/INFORME_01_CURRICULUM_Y_AUDITORIA_TACTICA.md
  - 12. Hoja de Ruta Evolutiva (Roadmap):
      - Línea 1 - Observabilidad y Telemetría: roadmap/01_LINEA_1_OBSERVABILIDAD_Y_TELEMETRIA.md
      - Línea 2 - Aceleración de Captura de VPs: roadmap/02_LINEA_2_ACELERACION_CAPTURA_VPS.md
      - Línea 3 - Fidelidad Normativa y Wargame: roadmap/03_LINEA_3_FIDELIDAD_NORMATIVA_Y_REGLAMENTO.md
      - Línea 4 - Explicabilidad XAI e IPB: roadmap/04_LINEA_4_EXPLICABILIDAD_XAI_E_IPB.md
      - Línea 5 - Generalización Procedural: roadmap/05_LINEA_5_GENERALIZACION_PROCEDURAL.md
      - Hoja de Ruta Evolutiva (Roadmap Maestro): 05_ROADMAP_EVOLUTIVO.md
