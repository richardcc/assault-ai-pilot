site_name: Assault Wargame & AI Platform
site_description: Documentación Canónica y Plataforma de Inteligencia Artificial Militar EfficientZero V2
site_author: Assault AI Core Team
site_dir: site
docs_dir: docs
exclude_docs: |
  pdfs/**
  papers/**
  audit_*
  README.md

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - 1. Arquitectura del Sistema: 01_ARQUITECTURA_DEL_SISTEMA.md
  - 2. Modelo del Juego y Reglas Tácticas: 02_MODELO_DEL_JUEGO_Y_REGLAS_TACTICAS.md
  - 3. Red Neuronal EfficientZero V2: 03_RED_NEURONAL_EFFICIENTZERO_V2.md
  - 4. Plataforma MLOps y Telemetría: 04_PLATAFORMA_MLOPS_Y_TELEMETRIA.md
  - 5. Hoja de Ruta Evolutiva: 05_ROADMAP_EVOLUTIVO.md
  - 6. Auditoría SOTA y Palma et al. 2025: 06_LITERATURE_AUDIT_CHANNELS_HEADS_TACTICS.md
  - 7. Sistema RAG Copilot: 06_SISTEMA_RAG_COPILOT.md
  - 8. Servicios Backend y Catálogo de APIs: 07_SERVICIOS_BACKEND_Y_CATALOGO_APIS.md
  - 9. Auditoría Reglamento vs. Engine: 08_AUDITORIA_REGLAMENTO_VS_ENGINE.md
