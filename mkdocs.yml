site_name: Assault Wargame & AI Platform
site_description: Documentación Canónica y Plataforma de Inteligencia Artificial Militar EfficientZero V2
site_author: Assault AI Core Team
site_dir: site
docs_dir: docs
exclude_docs: |
  pdfs/**
  papers/**
  audit_*
  README.md
  16_INFORME_EJECUCION_CURRICULUM_Y_AUDITORIA_TACTICA.md

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - I. Gobernanza y Arquitectura:
      - 01. Portal Canónico (Inicio): index.md
      - 02. Premisas del Proyecto y Gobernanza: 00_PREMISAS_DEL_PROYECTO.md
      - 03. Arquitectura del Sistema (5-Tier): 01_ARQUITECTURA_DEL_SISTEMA.md
  - II. Motor Wargame y Reglas:
      - 04. Modelo de Juego y Dinámica de Combate: 02_MODELO_DEL_JUEGO_Y_REGLAS_TACTICAS.md
      - 05. Auditoría Reglamento vs. Engine: 08_AUDITORIA_REGLAMENTO_VS_ENGINE.md
  - III. Inteligencia Artificial (EZv2):
      - 06. Red Neuronal EfficientZero V2: 03_RED_NEURONAL_EFFICIENTZERO_V2.md
      - 07. Auditoría Literatura Científica y Doctrinal: 06_LITERATURE_AUDIT_CHANNELS_HEADS_TACTICS.md
      - 08. Plan Estratégico Perfilado de Unidades IA: 14_PLAN_PERFILADO_UNIDADES_IA.md
      - 09. Currículums y Entrenamiento Progresivo: 15_CURRICULUMS_Y_ENTRENAMIENTO_PROGRESSIVO.md
  - IV. MLOps, Telemetría y Servicios:
      - 10. Plataforma MLOps y Telemetría: 04_PLATAFORMA_MLOPS_Y_TELEMETRIA.md
      - 11. Inventario Jerárquico Canónico de Métricas: 13_INVENTARIO_CANONICO_METRICAS.md
      - 12. Servicios Backend y Catálogo de APIs: 07_SERVICIOS_BACKEND_Y_CATALOGO_APIS.md
      - 13. Sistema RAG Copilot: 06_SISTEMA_RAG_COPILOT.md
      - 14. Manual del Simulador Táctico y HUD: 09_MANUAL_SIMULADOR_TACTICO_HUD.md
  - V. Informes de Ejecución:
      - 15. Informes de Ejecución - Cabecera y Catálogo: informes_ejecucion/00_CABECERA_INFORMES_EJECUCION.md
      - 16. Informe 01 - Currículum y Diagnóstico de Parálisis: informes_ejecucion/INFORME_01_CURRICULUM_Y_AUDITORIA_TACTICA.md
      - 17. Informe 02 - Currículum Multi-Fase y Comandante Prudente: informes_ejecucion/INFORME_02_CURRICULUM_Y_AUDITORIA_TACTICA.md
  - VI. Hoja de Ruta Evolutiva (Roadmap):
      - 18.1. Línea 1 - Observabilidad y Telemetría: roadmap/01_LINEA_1_OBSERVABILIDAD_Y_TELEMETRIA.md
      - 18.2. Línea 2 - Aceleración de Captura de VPs: roadmap/02_LINEA_2_ACELERACION_CAPTURA_VPS.md
      - 18.3. Línea 3 - Fidelidad Normativa y Wargame: roadmap/03_LINEA_3_FIDELIDAD_NORMATIVA_Y_REGLAMENTO.md
      - 18.4. Línea 4 - Explicabilidad XAI e IPB: roadmap/04_LINEA_4_EXPLICABILIDAD_XAI_E_IPB.md
      - 18.5. Línea 5 - Generalización Procedural: roadmap/05_LINEA_5_GENERALIZACION_PROCEDURAL.md
      - 18.6. Historial de Versiones e Hitos Consolidados: HISTORIAL_VERSIONES_COMPLETADAS.md
      - 18. Hoja de Ruta Evolutiva (Roadmap Maestro): 05_ROADMAP_EVOLUTIVO.md
