id: reward_stepin_bonus_v2_001
description: Increase step-in bonus and validate against R2.a gate.
surface: reward

apply:
  file: assault_sim/config/reward_config.json
  key: vp_stepin_selected_bonus
  old: 1.25
  new: 1.8

run:
  train_command: python -m assault_sim.train.train_sb3
  gate_command: powershell -ExecutionPolicy Bypass -File .\scripts\gate_r2a_no_regression_vs_r21i.ps1 -RunEval

acceptance:
  required:
    - true_win_rate >= baseline - 0.05
    - loss_rate <= baseline + 0.05
    - vp_entry_conversion_rate >= baseline - 0.10
